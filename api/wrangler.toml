# Local development only. Deployment is defined in infrastructure/ (docs/adr/0003, 0004).
# Bindings here must match the ones infrastructure/ defines.

name = "durables"
# The local entry point; the production build names src/index.ts explicitly.
main = "src/dev.ts"
compatibility_date = "2026-10-01"

# The website's build, served by this Worker. API routes run first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "durables"
database_id = "local"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "durables-documents"

# Rate limits applied by the API on publishing and the detection preview (docs/adr/0006).
# infrastructure/ reads these at synth, so this is the only place the limits are set.
[[unsafe.bindings]]
name = "PUBLISH_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "PREVIEW_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
